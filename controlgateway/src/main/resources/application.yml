server:
  port: ${CONTROL_GATEWAY_PORT:8081}

spring:
  application:
    name: control-gateway

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    issuer-uri: ${COGNITO_ISSUER_URI:}
    client-id: ${AWS_COGNITO_CLIENT_ID:}
    allowed-origins: ${CONTROL_GATEWAY_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  backend:
    base-url: ${BACKEND_BASE_URL:http://localhost:8080}
    timeout: ${BACKEND_TIMEOUT:10s}
  control-gateway:
    command-timeout: ${CONTROL_GATEWAY_COMMAND_TIMEOUT:15s}
    stream-timeout: ${CONTROL_GATEWAY_STREAM_TIMEOUT:15m}
    flight-controller:
      host: ${FLIGHT_CONTROLLER_GRPC_HOST:127.0.0.1}
      port: ${FLIGHT_CONTROLLER_GRPC_PORT:50051}
      tls: ${FLIGHT_CONTROLLER_GRPC_TLS:false}
      token: ${FLIGHT_CONTROLLER_GRPC_TOKEN:}
