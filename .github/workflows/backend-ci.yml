name: Backend CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spring-boot:
    name: Spring Boot
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: ondemand
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ondemand"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ondemand
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      JPA_DDL_AUTO: update
      JPA_OPEN_IN_VIEW: "false"
      JPA_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      JPA_FORMAT_SQL: "false"
      JPA_SHOW_SQL: "false"
      MYBATIS_MAPPER_LOCATIONS: classpath*:mapper/**/*.xml
      MYBATIS_TYPE_ALIASES_PACKAGE: com.ondemandmonitoring
      MYBATIS_MAP_UNDERSCORE_TO_CAMEL_CASE: "true"
      SERVER_PORT: "8080"
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 20MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 20MB
      AWS_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID_BAO: test
      AWS_SECRET_ACCESS_KEY_BAO: test
      AWS_S3_BUCKET: test
      AWS_S3_PREFIX: test
      AWS_COGNITO_REGION: ap-southeast-1
      CORS_ADDRESS: http://localhost:5173
    defaults:
      run:
        working-directory: ondemandmonitoring

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile
        run: ./mvnw -B -DskipTests compile

      - name: Test
        run: ./mvnw -B test

  drone-python:
    name: Drone Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: drone/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r drone/requirements.txt pytest

      - name: Run drone tests
        run: pytest drone/tests
