spring:
  application:
    name: ${SPRING_APPLICATION_NAME:ondemandmonitoring}
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    open-in-view: ${JPA_OPEN_IN_VIEW}
    properties:
      hibernate:
        dialect: ${JPA_HIBERNATE_DIALECT}
        format_sql: ${JPA_FORMAT_SQL}
    show-sql: ${JPA_SHOW_SQL}
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE}
  sql:
    init:
      mode: always

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:}
  ai:
    openai:
      api-key: ${AI_OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api/v1

      chat:
        model: ${AI_OPENROUTER_CHAT_MODEL}

      embedding:
        model: ${AI_OPENROUTER_EMBEDDING_MODEL}

    vectorstore:
      pgvector:
        initialize-schema: true
        schema-name: public
        table-name: vector_store
        dimensions: 1536

mybatis:
  mapper-locations: ${MYBATIS_MAPPER_LOCATIONS}
  type-aliases-package: ${MYBATIS_TYPE_ALIASES_PACKAGE}
  configuration:
    map-underscore-to-camel-case: ${MYBATIS_MAP_UNDERSCORE_TO_CAMEL_CASE}

server:
  port: ${SERVER_PORT}

aws:
  region: ${AWS_REGION}
  s3:
    access-key-bao: ${AWS_ACCESS_KEY_ID_BAO}
    secret-key-bao: ${AWS_SECRET_ACCESS_KEY_BAO}
    bucket: ${AWS_S3_BUCKET}
    prefix: ${AWS_S3_PREFIX}
  cognito:
    region: ${AWS_COGNITO_REGION}
    user-pool-id: ${AWS_COGNITO_USER_POOL_ID:}
    client-id: ${AWS_COGNITO_CLIENT_ID:}
    client-secret: ${AWS_COGNITO_CLIENT_SECRET:}
    domain: ${AWS_COGNITO_DOMAIN:}

cors:
  address: ${CORS_ADDRESS}

auth:
  outbox:
    fixed-delay-ms: ${AUTH_OUTBOX_FIXED_DELAY_MS:30000}
    max-attempts: ${AUTH_OUTBOX_MAX_ATTEMPTS:8}
  refresh-token-cookie:
    secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
    max-age-seconds: ${AUTH_REFRESH_COOKIE_MAX_AGE_SECONDS:2592000}
    same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}

mission:
  replanning:
    enabled: ${MISSION_REPLANNING_ENABLED:true}
    cooldown-seconds: ${MISSION_REPLANNING_COOLDOWN_SECONDS:10}
    route-deviation-threshold-meters: ${MISSION_REPLANNING_ROUTE_DEVIATION_THRESHOLD_METERS:20.0}
    minimum-battery-reserve-percent: ${MISSION_REPLANNING_MINIMUM_BATTERY_RESERVE_PERCENT:20.0}
    max-replans-per-mission: ${MISSION_REPLANNING_MAX_REPLANS_PER_MISSION:5}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
